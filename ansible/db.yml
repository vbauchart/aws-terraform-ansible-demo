---
- name: Database hosts
  hosts: db
  vars:
    ansible_python_interpreter: auto
  roles:
    - common
  become: true

  tasks:
    - name: mariadb - install database server and python dependencies
      dnf:
        name:
          - mariadb105-server
          - python3-pip
        state: present

    - name: mariadb - start and enable service
      service:
        name: mariadb
        state: started
        enabled: true

    - name: mariadb - install PyMySQL python package
      pip:
        name: PyMySQL

    - name: mariadb - create wordpress database
      mysql_db:
        login_unix_socket: /var/lib/mysql/mysql.sock
        name: "{{ mysql_db_name }}"
        state: present

    - name: mariadb - set remote user permissions for web instances
      mysql_user:
        login_unix_socket: /var/lib/mysql/mysql.sock
        name: "{{ mysql_user }}"
        host: "{{ item }}"
        password: "{{ mysql_password }}"
        priv: "{{ mysql_db_name }}.*:ALL"
        state: present
      with_items: "{{ groups['web'] }}"
