---
- name: Web hosts
  hosts: web
  vars:
    ansible_python_interpreter: auto
  roles:
    - common
  become: true

  tasks:
    - name: NFS - install dependencies
      dnf:
        name: nfs-utils
        state: present

    - name: NFS - Mount wp-content volume
      ansible.posix.mount:
        src: "{{ nfs_wp_content_ip }}"
        path: /var/www/wordpress/wp-content
        fstype: nfs4
        opts: nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev
        state: mounted
        boot: true

    - name: wordpress - install dependencies (Apache & PHP)
      dnf:
        name:
          - httpd
          - php
          - php-mysqlnd
          - php-gd
          - php-xml
          - php-mbstring
          - php-intl
          - tar
        state: present

    - name: wordpress - check deployment exists
      stat:
        path: /var/www/wordpress/wp-config.php
      register: wordpress_config

    - name: wordpress - deploy package
      unarchive:
        src: https://wordpress.org/latest.tar.gz
        dest: /var/www/
        remote_src: true
        owner: apache
        group: apache
      when: not wordpress_config.stat.exists

    - name: wordpress - Copy sample config file
      command: cp /var/www/wordpress/wp-config-sample.php /var/www/wordpress/wp-config.php
      when: not wordpress_config.stat.exists

    - name: wordpress - Update Wordpress config file
      lineinfile:
        path: /var/www/wordpress/wp-config.php
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      no_log: true
      with_items:
        - { regexp: "define\\( 'DB_NAME', '(.)+' \\);", line: "define( 'DB_NAME', '{{ mysql_db_name }}' );" }
        - { regexp: "define\\( 'DB_USER', '(.)+' \\);", line: "define( 'DB_USER', '{{ mysql_user }}' );" }
        - { regexp: "define\\( 'DB_PASSWORD', '(.)+' \\);", line: "define( 'DB_PASSWORD', '{{ mysql_password }}' );" }
        - { regexp: "define\\( 'DB_HOST', '(.)+' \\);", line: "define( 'DB_HOST', '{{ groups['db'].0 }}' );" }

    - name: wordpress - Update Apache DocumentRoot
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^DocumentRoot "/var/www/html"'
        line: 'DocumentRoot "/var/www/wordpress"'
      notify:
        - Restart httpd

    - name: wordpress - Allow Override for WordPress Directory
      blockinfile:
        path: /etc/httpd/conf/httpd.conf
        block: |
          <Directory "/var/www/wordpress">
              AllowOverride All
              Require all granted
          </Directory>
      notify:
        - Restart httpd

    - name: Check httpd started and enabled
      service:
        name: httpd
        state: started
        enabled: true

  handlers:
    - name: Restart httpd
      service:
        name: httpd
        state: restarted
